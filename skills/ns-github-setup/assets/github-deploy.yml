# NetSuite SDF — GitHub Actions Deployment Pipeline
#
# Generated by ns-github-setup skill.
# Lines marked "# CONFIGURE:" require values specific to your project.
#
# Required setup before this workflow will function:
#   1. Create GitHub Environments: "sandbox" and "production"
#      Settings → Environments → New environment
#   2. Add secrets to each environment (see HANDOFF_CHECKLIST below)
#   3. Add required reviewers to the "production" environment
#   4. Enable branch protection on main (require PR + require "Validate" to pass)
#
# HANDOFF_CHECKLIST — secrets to create per environment:
#   NS_ACCOUNT_ID       NetSuite account ID (e.g., TSTDRV1234567 for sandbox)
#   NS_CERTIFICATE_ID   Certificate ID from NetSuite OAuth 2.0 setup
#   NS_PRIVATE_KEY_B64  RSA private key, base64-encoded: base64 -w 0 private.pem
#   NS_AUTH_ID          Auth alias string (e.g., ci-deploy-sb / ci-deploy-prod)
#
# See references/oauth_setup_guide.md for certificate generation steps.

name: NetSuite SDF Deploy

on:
  push:
    branches:
      - main         # → Production
      - develop      # → Sandbox
      # CONFIGURE: Add 'release/**' or other branches if you have more environments
  pull_request:
    branches:
      - main
      - develop      # Validation runs on all PRs — no deploy on PR events

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Validate — runs on every push and every PR
# No NetSuite connection needed. Catches syntax errors and missing refs early.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate SDF Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Full history needed for git diff in generate-deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli

      - name: Validate SDF project structure
        run: suitecloud project:validate

      - name: Run unit tests
        # Only runs if package.json with a jest dependency exists
        run: |
          if [ -f package.json ] && grep -q '"jest"' package.json 2>/dev/null; then
            npx jest --passWithNoTests
          else
            echo "No Jest configuration found — skipping unit tests."
          fi

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: Deploy to Sandbox — on push to develop only
# ─────────────────────────────────────────────────────────────────────────────
  deploy-sandbox:
    name: Deploy to Sandbox
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: sandbox      # Scopes NS_ACCOUNT_ID etc. to sandbox environment secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli

      - name: Decode private key
        run: |
          echo "${{ secrets.NS_PRIVATE_KEY_B64 }}" | base64 -d > /tmp/ns_private.pem
          chmod 600 /tmp/ns_private.pem

      - name: Configure SDF authentication (OAuth 2.0 M2M)
        run: |
          suitecloud account:setup:ci \
            --account "${{ secrets.NS_ACCOUNT_ID }}" \
            --authid "${{ secrets.NS_AUTH_ID }}" \
            --certificateid "${{ secrets.NS_CERTIFICATE_ID }}" \
            --privatekeypath "/tmp/ns_private.pem"

      # Drift detection — checks if the sandbox account has diverged from Git.
      # Remove or disable if your team is SDF-only (no UI configurators).
      # To enable: set DRIFT_DETECTION=true in the "sandbox" GitHub Environment variables.
      - name: Check for UI drift before deploying
        if: vars.DRIFT_DETECTION == 'true'
        run: node ci/check-drift.js --authid "${{ secrets.NS_AUTH_ID }}"

      - name: Fetch production branch for diff baseline
        run: git fetch origin main
        # Ensures origin/main is available as a remote-tracking ref for generate-deploy.js

      - name: Generate deploy.xml from git diff
        run: node ci/generate-deploy.js origin/main
        # CONFIGURE: Change origin/main if your production branch has a different name

      - name: Deploy to NetSuite Sandbox
        run: suitecloud project:deploy --authid "${{ secrets.NS_AUTH_ID }}" --accountspecificvalues WARNING

      - name: Clean up private key
        if: always()
        run: rm -f /tmp/ns_private.pem

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: Deploy to Production — on push to main only
# The "production" GitHub Environment should have required reviewer approval.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # Required reviewer approval configured in GitHub Environment settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli

      - name: Decode private key
        run: |
          echo "${{ secrets.NS_PRIVATE_KEY_B64 }}" | base64 -d > /tmp/ns_private.pem
          chmod 600 /tmp/ns_private.pem

      - name: Configure SDF authentication (OAuth 2.0 M2M)
        run: |
          suitecloud account:setup:ci \
            --account "${{ secrets.NS_ACCOUNT_ID }}" \
            --authid "${{ secrets.NS_AUTH_ID }}" \
            --certificateid "${{ secrets.NS_CERTIFICATE_ID }}" \
            --privatekeypath "/tmp/ns_private.pem"

      - name: Generate deploy.xml from git diff
        # github.event.before = SHA of main before this push — deploys exactly what changed.
        run: node ci/generate-deploy.js "${{ github.event.before }}"

      - name: Deploy to NetSuite Production
        run: suitecloud project:deploy --authid "${{ secrets.NS_AUTH_ID }}" --accountspecificvalues WARNING

      - name: Clean up private key
        if: always()
        run: rm -f /tmp/ns_private.pem
